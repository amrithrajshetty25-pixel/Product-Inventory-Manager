<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Product Inventory Manager</h1>
            
        </header>

        <section class="panel">
            <h2>Add New Product</h2>

            <form id="productForm" class="product-form">
                <div class="field">
                    <label for="productId">Product ID</label>
                    <input id="productId" type="number" min="1" value="5" required>
                </div>

                <div class="field">
                    <label for="productName">Product Name</label>
                    <input id="productName" type="text" placeholder="Enter product name" required>
                </div>

                <div class="field">
                    <label for="price">Price</label>
                    <input id="price" type="number" min="1" step="0.01" placeholder="Enter price" required>
                </div>

                <div class="field">
                    <label for="tags">Tags</label>
                    <input id="tags" type="text" placeholder="Electronics, Computer">
                </div>

                <label class="checkbox-field">
                    <input id="inStock" type="checkbox" checked>
                    <span>In Stock</span>
                </label>

                <button class="primary-btn" type="submit">Add Product</button>
            </form>
        </section>

        <section class="panel controls">
            <div class="search-box">
                <label for="searchInput">Search Products</label>
                <input id="searchInput" type="search" placeholder="Search by name or tag">
            </div>

            <div class="filter-buttons">
                <button id="showAll" class="secondary-btn" type="button">Show All</button>
                <button id="availableOnly" class="secondary-btn" type="button">Available Only</button>
            </div>

            <div class="discount-box">
                <label for="discountPercent">Discount %</label>
                <input id="discountPercent" type="number" min="0" max="100" value="10">
                <button id="applyDiscount" class="primary-btn" type="button">Apply Discount</button>
            </div>
        </section>

        <section class="panel">
            <div class="inventory-heading">
                <h2>Inventory List</h2>
                <span id="productCount" class="count-badge">Products Shown: 0</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Tags</th>
                            <th>Discounted Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody"></tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>Product Inventory Manager • TypeScript Project</p>
        </footer>
    </main>

    <script type="module" src="./dist/inventory.js"></script>
</body>
</html>
